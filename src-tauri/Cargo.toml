[package]
name = "oneboost"
version = "1.3.2"
description = "1Boost — PC usage analytics for Windows"
authors = ["1Boost"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oneboost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oneboost-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Delta updates. The three crypto/HTTP crates are pinned to the same major
# versions tauri-plugin-updater already pulls in, so the updater and this module
# share one copy of each rather than linking two.
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2"
zip = "4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "stream",
] }
windows-sys = { version = "0.52", features = [
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
] }
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
