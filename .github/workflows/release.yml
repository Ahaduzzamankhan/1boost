# 1Boost release pipeline.
#
# Triggers on a version tag push (e.g. `v1.1.0`) or manually via workflow_dispatch.
# Verifies the tag matches package.json, runs Rust + TS tests, builds the native
# layer, packs the NSIS installer with electron-builder, and publishes a GitHub
# Release with the installer attached.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Determine release channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qiE 'v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run Rust layout tests
        working-directory: electron/native
        run: cargo test --release

      - name: Build native layer
        run: npm run native:build

      - name: Generate app icons (gitignored, required by electron-builder)
        run: node scripts/make-icons.js

      - name: Build renderer, main and preload
        run: node scripts/build.mjs all

      - name: Pack Windows installer (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
        # --publish always uploads the full update feed alongside the
        # installer: 1Boost-Setup-<version>.exe, 1Boost-Setup-<version>.exe
        # .blockmap (differential/delta source for electron-updater) and
        # latest.yml. The release is created as a draft; the next step fills
        # in the changelog and publishes it.

      - name: Add changelog to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          node scripts/release-notes.mjs "${TAG#v}" release-notes.md
          # electron-builder already attached the .exe, .exe.blockmap (delta
          # source) and latest.yml. Verify the blockmap is present so delta
          # updates can never silently ship without it, then set the notes.
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '\.exe\.blockmap$' \
            || { echo '::error::blockmap missing from release assets'; exit 1; }
          gh release edit "$TAG" --notes-file release-notes.md

      - name: Publish release (stable) or mark prerelease (alpha/beta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Boost-Setup
          path: release/**/*.exe
          if-no-files-found: error
