# 1Boost release pipeline (Tauri 2).
#
# Triggers on a version tag push (e.g. `v1.2.0`) or manually. Verifies the tag
# matches package.json AND tauri.conf.json, runs Rust + TS tests, builds the
# signed NSIS installer via tauri-action, generates the updater manifest
# (latest.json), attaches installer + signature + manifest to the GitHub
# Release, and publishes it with the changelog.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            src-tauri

      - name: Verify tag matches package.json and tauri.conf.json versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAURI_VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ] || [ "$TAURI_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${PKG_VERSION} / tauri.conf.json ${TAURI_VERSION}"
            exit 1
          fi

      - name: Determine release channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qiE 'v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      # The updater private key is one line of base64 that is easy to mangle
      # when it is pasted: CRLF line endings, a line-wrapped value, a lost or
      # duplicated character in a repetitive run, or a whole minisign file
      # (which appends the *public* key line). Any of those produce the opaque
      # "incorrect updater private key password: Invalid input for the given
      # encoding" from the signer — after a six minute Rust build.
      #
      # Normalize the value, check it against the SHA-256 fingerprint of the
      # keypair whose public half is committed in src-tauri/tauri.conf.json,
      # then prove the password actually decrypts it. This fails in seconds.
      - name: Prepare and verify updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256='1ce293b039296d68406a91fc44386c4df02c3b5a7eb2e79393816d6b6b9e07fd'
          EXPECTED_LENGTH=348
          # Join every base64-only line (repairs wrapping) and clamp to the
          # key length (drops the public key line of a whole-file paste).
          KEY_ALL=$(printf '%s\n' "$RAW_KEY" | tr -d '\r' | grep -E '^[A-Za-z0-9+/]+={0,2}[[:space:]]*$' | tr -d ' \t\n' || true)
          KEY_CLEAN=$(printf '%s' "$KEY_ALL" | cut -c1-"$EXPECTED_LENGTH")
          PASS_CLEAN=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          if [ -z "$KEY_CLEAN" ] || [ -z "$PASS_CLEAN" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY / _PASSWORD secrets are empty"
            exit 1
          fi
          ACTUAL_SHA256=$(printf '%s' "$KEY_CLEAN" | sha256sum | cut -d' ' -f1)
          echo "signing secret: ${#KEY_CLEAN} chars, sha256 $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the v1.2.0 signing key: expected sha256 $EXPECTED_SHA256 ($EXPECTED_LENGTH chars), got $ACTUAL_SHA256 (${#KEY_CLEAN} chars). Re-paste it as one unbroken base64 line with no header."
            exit 1
          fi
          PROBE_DIR="$RUNNER_TEMP/keyprobe"
          mkdir -p "$PROBE_DIR"
          printf '%s' "$KEY_CLEAN" > "$PROBE_DIR/oneboost.key"
          printf '1boost-signing-probe' > "$PROBE_DIR/probe.bin"
          if ! npx --no-install tauri signer sign -p "$PASS_CLEAN" -f "$PROBE_DIR/oneboost.key" "$PROBE_DIR/probe.bin" > "$PROBE_DIR/sign.log" 2>&1; then
            cat "$PROBE_DIR/sign.log"
            echo "::error::key fingerprint matched but TAURI_SIGNING_PRIVATE_KEY_PASSWORD could not decrypt it"
            exit 1
          fi
          echo "updater signing key verified (password opens the committed keypair)"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_CLEAN"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASS_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run Rust tests (native crate)
        working-directory: native
        run: cargo test --release

      - name: Run Rust tests (Tauri backend crate)
        working-directory: src-tauri
        run: cargo test --lib --release

      - name: Generate Tauri icon set
        run: node scripts/make-tauri-icons.js

      - name: Build renderer bundle
        run: node scripts/build.mjs renderer

      - name: Build signed Tauri NSIS release
        uses: tauri-apps/tauri-action@v0
        id: tauria
        # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) come pre-normalized from the
        # GITHUB_ENV set above; do not re-map raw secrets here or they would
        # override the sanitized values.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '1Boost ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Render changelog notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/gen-latest-json.mjs "$VERSION" release-notes.md latest.json
          # Find the NSIS installer + signature the tauri-action uploaded and
          # inline the minisign signature into latest.json, then upload it.
          # tauri-action names assets 1Boost_<version>_x64-setup.exe plus the
          # v1-compatible updater payload 1Boost_<version>_x64-setup.nsis.zip
          # (with .sig). Discover the actual uploaded names from the .sig
          # files instead of guessing.
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" --pattern "*.exe.sig" --dir sigtmp
          SIG_FILE=$(ls sigtmp/*.exe.sig 2>/dev/null | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "::error::no .exe.sig updater signature found in release assets"
            exit 1
          fi
          node - <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const sigFiles = fs.readdirSync('sigtmp').filter((f) => f.endsWith('.exe.sig')).sort();
          if (!sigFiles.length) {
            console.error('::error::no .exe.sig files after download');
            process.exit(1);
          }
          const sigName = sigFiles[0]; // e.g. 1Boost_1.2.0_x64-setup.nsis.zip.sig
          const payload = sigName.replace(/\.sig$/, '');
          m.platforms['windows-x86_64'].signature = fs.readFileSync(`sigtmp/${sigName}`, 'utf8').trim();
          m.platforms['windows-x86_64'].url =
            `https://github.com/Ahaduzzamankhan/1boost/releases/download/${process.env.GITHUB_REF_NAME}/${payload}`;
          fs.writeFileSync('latest.json', JSON.stringify(m, null, 2) + '\n');
          console.log(`latest.json ready for ${m.version} -> ${payload}`);
          EOF
          gh release upload "$TAG" latest.json --clobber

      # Migration shim: v1.1.x installs still run Electron and update via
      # electron-updater, which reads latest.yml from the newest published
      # release. Ship it alongside latest.json so existing users are pulled
      # onto the Tauri 1.2.0 installer automatically.
      - name: Generate Electron latest.yml (v1.1.x migration)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          EXE=$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- "_x64-setup\.exe$" | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::installer asset not found for latest.yml generation"
            exit 1
          fi
          gh release download "$TAG" --pattern "$EXE" --dir exetmp
          node scripts/gen-latest-yml.mjs "$VERSION" "exetmp/$EXE" latest.yml
          gh release upload "$TAG" latest.yml --clobber

      - name: Publish release (stable) or mark prerelease (alpha/beta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Verify updater prerequisites: installer, signature, manifest.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -q -- "_x64-setup\.exe$" || { echo '::error::installer missing'; exit 1; }
          echo "$ASSETS" | grep -q -- "_x64-setup\.nsis\.zip\.sig$" || { echo '::error::updater signature missing'; exit 1; }
          echo "$ASSETS" | grep -q -- "_x64-setup\.nsis\.zip$" || { echo '::error::updater payload missing'; exit 1; }
          echo "$ASSETS" | grep -q '^latest\.json$' || { echo '::error::latest.json missing'; exit 1; }
          echo "$ASSETS" | grep -q '^latest\.yml$' || { echo '::error::latest.yml missing'; exit 1; }
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Boost-Setup
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
