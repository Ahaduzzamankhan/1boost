# 1Boost release pipeline (Tauri 2).
#
# Triggers on a version tag push (e.g. `v1.2.0`) or manually. Verifies the tag
# matches package.json AND tauri.conf.json, runs Rust + TS tests, builds the
# signed NSIS installer via tauri-action, generates the updater manifest
# (latest.json), builds the signed binary delta patch that makes the update
# cheap, attaches installer + signatures + manifests to the GitHub Release, and
# publishes it with the changelog.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            src-tauri

      - name: Verify tag matches package.json and tauri.conf.json versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAURI_VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ] || [ "$TAURI_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${PKG_VERSION} / tauri.conf.json ${TAURI_VERSION}"
            exit 1
          fi

      - name: Determine release channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qiE 'v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      # Updater signing keypair. It lives in the repository (see the warning in
      # .github/signing/updater-credentials.json) rather than in an Actions
      # secret, so the pipeline needs no manual setup. Prefer the secret when
      # one exists: it is used verbatim, otherwise the file is the fallback.
      #
      # The key is verified by actually signing a probe file before the ~6
      # minute Rust build, so a corrupted or mismatched keypair fails in
      # seconds with a clear message instead of an opaque signer error.
      - name: Load and verify updater signing key
        shell: bash
        env:
          SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CREDENTIALS_FILE: .github/signing/updater-credentials.json
        run: |
          set -euo pipefail
          PROBE_DIR="$RUNNER_TEMP/keyprobe"
          mkdir -p "$PROBE_DIR"
          printf '1boost-signing-probe' > "$PROBE_DIR/probe.bin"
          SELECTED_KEY=""
          SELECTED_PASS=""
          SELECTED_FROM=""
          # Candidate 1: the Actions secret (preferred when it is healthy).
          if [ -n "${SECRET_KEY//[[:space:]]/}" ]; then
            CAND_KEY=$(printf '%s' "$SECRET_KEY" | tr -d ' \t\r\n')
            CAND_PASS=$(printf '%s' "$SECRET_PASSWORD" | tr -d '\r\n')
            printf '%s' "$CAND_KEY" > "$PROBE_DIR/candidate.key"
            if npx --no-install tauri signer sign -p "$CAND_PASS" -f "$PROBE_DIR/candidate.key" "$PROBE_DIR/probe.bin" > "$PROBE_DIR/sign.log" 2>&1; then
              SELECTED_KEY="$CAND_KEY"; SELECTED_PASS="$CAND_PASS"; SELECTED_FROM="Actions secret"
            else
              echo "::warning::the TAURI_SIGNING_PRIVATE_KEY secret does not open a usable keypair; falling back to $CREDENTIALS_FILE"
              sed 's/^/    /' "$PROBE_DIR/sign.log"
            fi
          fi
          # Candidate 2: the keypair committed to the repository.
          if [ -z "$SELECTED_KEY" ] && [ -f "$CREDENTIALS_FILE" ]; then
            read -r FILE_KEY FILE_PASS <<<"$(node -e '
              const fs = require("fs");
              const c = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const key = String(c.privateKey || "").replace(/\s+/g, "");
              const pass = String(c.password || "").replace(/\s+/g, "");
              if (!key || !pass) {
                console.error("::error::updater-credentials.json is missing privateKey/password");
                process.exit(1);
              }
              console.log(`${key} ${pass}`);
            ' "$CREDENTIALS_FILE")"
            printf '%s' "$FILE_KEY" > "$PROBE_DIR/candidate.key"
            if npx --no-install tauri signer sign -p "$FILE_PASS" -f "$PROBE_DIR/candidate.key" "$PROBE_DIR/probe.bin" > "$PROBE_DIR/sign.log" 2>&1; then
              SELECTED_KEY="$FILE_KEY"; SELECTED_PASS="$FILE_PASS"; SELECTED_FROM="$CREDENTIALS_FILE"
            else
              echo "::error::the keypair in $CREDENTIALS_FILE is unusable — key truncated/corrupt, or the password does not match it"
              sed 's/^/    /' "$PROBE_DIR/sign.log"
              exit 1
            fi
          fi
          if [ -z "$SELECTED_KEY" ]; then
            echo "::error::no updater signing key available (no usable secret and no $CREDENTIALS_FILE)"
            exit 1
          fi
          # Keep the key out of the run log even though it is in the repo.
          echo "::add-mask::$SELECTED_KEY"
          echo "::add-mask::$SELECTED_PASS"
          echo "updater signing key verified via $SELECTED_FROM (${#SELECTED_KEY} chars)"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$SELECTED_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SELECTED_PASS"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run Rust tests (native crate)
        working-directory: native
        run: cargo test --release

      - name: Run Rust tests (Tauri backend crate)
        working-directory: src-tauri
        run: cargo test --lib --release

      - name: Generate Tauri icon set
        run: node scripts/make-tauri-icons.js

      - name: Build renderer bundle
        run: node scripts/build.mjs renderer

      # Rendered before the build so tauri-action can use it as the release
      # body. Falls back to package.json's version for non-tag runs.
      - name: Render changelog notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          node scripts/release-notes.mjs "$VERSION" release-notes.md
          # tauri-action's `releaseBody` input is a literal string, not a path,
          # so the rendered notes have to be handed to it via the environment.
          {
            echo "RELEASE_BODY<<1BOOST_EOF_NOTES"
            cat release-notes.md
            echo ""
            echo "1BOOST_EOF_NOTES"
          } >> "$GITHUB_ENV"

      - name: Build signed Tauri NSIS release
        uses: tauri-apps/tauri-action@v0
        id: tauria
        # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) come pre-normalized from the
        # GITHUB_ENV set above; do not re-map raw secrets here or they would
        # override the sanitized values.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '1Boost ${{ github.ref_name }}'
          releaseDraft: true
          releaseBody: ${{ env.RELEASE_BODY }}
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/gen-latest-json.mjs "$VERSION" release-notes.md latest.json
          # Find the NSIS installer + signature the tauri-action uploaded and
          # inline the minisign signature into latest.json, then upload it.
          # tauri-action names assets 1Boost_<version>_x64-setup.exe plus the
          # v1-compatible updater payload 1Boost_<version>_x64-setup.nsis.zip
          # (with .sig). Discover the actual uploaded names from the .sig
          # files instead of guessing.
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" --pattern "*.exe.sig" --dir sigtmp
          SIG_FILE=$(ls sigtmp/*.exe.sig 2>/dev/null | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "::error::no .exe.sig updater signature found in release assets"
            exit 1
          fi
          node - <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const sigFiles = fs.readdirSync('sigtmp').filter((f) => f.endsWith('.exe.sig')).sort();
          if (!sigFiles.length) {
            console.error('::error::no .exe.sig files after download');
            process.exit(1);
          }
          const sigName = sigFiles[0]; // e.g. 1Boost_1.2.0_x64-setup.nsis.zip.sig
          const payload = sigName.replace(/\.sig$/, '');
          m.platforms['windows-x86_64'].signature = fs.readFileSync(`sigtmp/${sigName}`, 'utf8').trim();
          m.platforms['windows-x86_64'].url =
            `https://github.com/Ahaduzzamankhan/1boost/releases/download/${process.env.GITHUB_REF_NAME}/${payload}`;
          fs.writeFileSync('latest.json', JSON.stringify(m, null, 2) + '\n');
          console.log(`latest.json ready for ${m.version} -> ${payload}`);
          EOF
          gh release upload "$TAG" latest.json --clobber

      # Delta updates (primary updater path, full update is the fallback).
      #
      # An install that has the previous release's updater payload cached can
      # rebuild this release's payload from a patch instead of downloading it
      # again. The patch is generated against the newest previously published
      # stable release, signed with the same release key, and named so the
      # client can derive its URL from the payload URL in latest.json.
      #
      # Nothing here is load-bearing for the release: the client falls back to
      # the full payload whenever the patch is absent or fails verification, so
      # a delta problem degrades the download size and nothing else.
      - name: Generate and sign the delta patch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          # This release is still a draft at this point, so the newest
          # published stable release is the one installs are actually sitting on.
          BASE_TAG=$(gh release list --limit 20 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | grep -v "^${TAG}$" | head -1)
          if [ -z "$BASE_TAG" ]; then
            echo "::notice::no earlier published release to build a delta from; the full updater path will be used"
            exit 0
          fi
          BASE_VERSION="${BASE_TAG#v}"
          echo "building a delta from $BASE_TAG to $TAG"

          rm -rf basetmp targettmp
          mkdir -p basetmp targettmp
          if ! gh release download "$BASE_TAG" --pattern "*_x64-setup.nsis.zip" --dir basetmp; then
            echo "::notice::$BASE_TAG has no updater payload to patch against; skipping the delta"
            exit 0
          fi
          if ! gh release download "$TAG" --pattern "*_x64-setup.nsis.zip" --dir targettmp; then
            echo "::error::this release's updater payload is missing"
            exit 1
          fi
          BASE_FILE=$(ls basetmp/*.nsis.zip 2>/dev/null | head -1)
          TARGET_FILE=$(ls targettmp/*.nsis.zip 2>/dev/null | head -1)
          if [ -z "$BASE_FILE" ] || [ -z "$TARGET_FILE" ]; then
            echo "::warning::could not resolve the payload files; skipping the delta"
            exit 0
          fi

          # Exit 2 means the patch would not be smaller than the payload, which
          # is not worth shipping; anything else is a warning, never a failure.
          node scripts/gen-delta.mjs "$BASE_FILE" "$TARGET_FILE" raw.1bdelta
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::delta generation failed (exit $STATUS); releases keep using the full update"
            exit 0
          fi

          # Sign with the key already loaded and verified earlier in this run.
          # `tauri signer sign` picks TAURI_SIGNING_PRIVATE_KEY up from the
          # environment and turns it into a --private-key argument, which it
          # refuses to combine with an explicit --private-key-path. Strip it
          # from this one command's environment; the key is passed by file.
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater.key"
          if ! env -u TAURI_SIGNING_PRIVATE_KEY npx --no-install tauri signer sign \
              -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              -f "$RUNNER_TEMP/updater.key" raw.1bdelta; then
            echo "::warning::could not sign the delta; releasing without it"
            exit 0
          fi

          ASSET="1Boost_${VERSION}_x64-setup.from-${BASE_VERSION}.1bdelta"
          mv raw.1bdelta "$ASSET"
          gh release upload "$TAG" "$ASSET" "$ASSET.sig" --clobber
          echo "published ${ASSET} ($(wc -c < "$ASSET") bytes) plus its signature"

      # Migration shim: v1.1.x installs still run Electron and update via
      # electron-updater, which reads latest.yml from the newest published
      # release. Ship it alongside latest.json so existing users are pulled
      # onto the Tauri 1.2.0 installer automatically.
      - name: Generate Electron latest.yml (v1.1.x migration)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          EXE=$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- "_x64-setup\.exe$" | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::installer asset not found for latest.yml generation"
            exit 1
          fi
          gh release download "$TAG" --pattern "$EXE" --dir exetmp
          node scripts/gen-latest-yml.mjs "$VERSION" "exetmp/$EXE" latest.yml
          gh release upload "$TAG" latest.yml --clobber

      - name: Publish release (stable) or mark prerelease (alpha/beta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Verify updater prerequisites: installer, signature, manifest.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -q -- "_x64-setup\.exe$" || { echo '::error::installer missing'; exit 1; }
          echo "$ASSETS" | grep -q -- "_x64-setup\.nsis\.zip\.sig$" || { echo '::error::updater signature missing'; exit 1; }
          echo "$ASSETS" | grep -q -- "_x64-setup\.nsis\.zip$" || { echo '::error::updater payload missing'; exit 1; }
          echo "$ASSETS" | grep -q '^latest\.json$' || { echo '::error::latest.json missing'; exit 1; }
          echo "$ASSETS" | grep -q '^latest\.yml$' || { echo '::error::latest.yml missing'; exit 1; }
          # A delta is only ever offered together with its signature.
          if echo "$ASSETS" | grep -q '\.1bdelta$'; then
            echo "$ASSETS" | grep -q '\.1bdelta\.sig$' || { echo '::error::delta patch is not signed'; exit 1; }
          fi
          # Set the body from the rendered file, then prove it took. The
          # Tauri migration lost this step and passed the *filename* to
          # tauri-action's literal `releaseBody`, which published the text
          # "release-notes.md" as the body of 1.2.1 and 1.3.0.
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file release-notes.md
          fi
          BODY=$(gh release view "$TAG" --json body --jq '.body')
          if [ "$BODY" = "release-notes.md" ] || [ -z "$BODY" ]; then
            echo "::error::release body was not set from release-notes.md"
            exit 1
          fi
          echo "release body set ($(printf '%s' "$BODY" | wc -l) lines)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Boost-Setup
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
