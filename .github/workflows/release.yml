# 1Boost release pipeline (Tauri 2).
#
# Triggers on a version tag push (e.g. `v1.2.0`) or manually. Verifies the tag
# matches package.json AND tauri.conf.json, runs Rust + TS tests, builds the
# signed NSIS installer via tauri-action, generates the updater manifest
# (latest.json), attaches installer + signature + manifest to the GitHub
# Release, and publishes it with the changelog.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            src-tauri

      - name: Verify tag matches package.json and tauri.conf.json versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAURI_VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ] || [ "$TAURI_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${PKG_VERSION} / tauri.conf.json ${TAURI_VERSION}"
            exit 1
          fi

      - name: Determine release channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qiE 'v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run Rust tests (native crate)
        working-directory: native
        run: cargo test --release

      - name: Run Rust tests (Tauri backend crate)
        working-directory: src-tauri
        run: cargo test --lib --release

      - name: Generate Tauri icon set
        run: node scripts/make-tauri-icons.js

      - name: Build renderer bundle
        run: node scripts/build.mjs renderer

      - name: Build signed Tauri NSIS release
        uses: tauri-apps/tauri-action@v0
        id: tauria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '1Boost ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Render changelog notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/gen-latest-json.mjs "$VERSION" release-notes.md latest.json
          # Find the NSIS installer + signature the tauri-action uploaded and
          # inline the minisign signature into latest.json, then upload it.
          TAG="${GITHUB_REF_NAME}"
          EXE_NAME="1Boost-Setup-${VERSION}-x64-setup.exe"
          SIG_NAME="${EXE_NAME}.sig"
          gh release download "$TAG" --pattern "*.sig" --dir sigtmp
          if [ ! -f "sigtmp/${SIG_NAME}" ]; then
            # tauri-action may name files slightly differently; take any sig.
            FIRST_SIG=$(ls sigtmp/*.sig 2>/dev/null | head -1 || true)
            if [ -z "$FIRST_SIG" ]; then
              echo "::error::no .sig updater signature found in release assets"
              exit 1
            fi
            mv "$FIRST_SIG" "sigtmp/${SIG_NAME}"
          fi
          node - <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const sigFiles = fs.readdirSync('sigtmp').filter((f) => f.endsWith('.sig'));
          m.platforms['windows-x86_64'].signature = fs.readFileSync(`sigtmp/${sigFiles[0]}`, 'utf8').trim();
          const exe = sigFiles[0].replace(/\.sig$/, '');
          m.platforms['windows-x86_64'].url =
            `https://github.com/Ahaduzzamankhan/1boost/releases/download/${process.env.GITHUB_REF_NAME}/${exe}`;
          fs.writeFileSync('latest.json', JSON.stringify(m, null, 2) + '\n');
          console.log('latest.json ready for', m.version);
          EOF
          gh release upload "$TAG" latest.json --clobber

      - name: Publish release (stable) or mark prerelease (alpha/beta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Verify updater prerequisites: installer, signature, manifest.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -q -- "-x64-setup\.exe$" || { echo '::error::installer missing'; exit 1; }
          echo "$ASSETS" | grep -q '\.exe\.sig$' || { echo '::error::updater signature missing'; exit 1; }
          echo "$ASSETS" | grep -q '^latest\.json$' || { echo '::error::latest.json missing'; exit 1; }
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Boost-Setup
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
