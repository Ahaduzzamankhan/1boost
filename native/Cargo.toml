[package]
name = "oneboost-native"
version = "1.2.0"
edition = "2021"

[lib]
name = "oneboost_native"
# cdylib: standalone oneboost_native.dll (kept for the Electron v1.1.x FFI
# layout during the migration window). rlib: consumed by the Tauri backend.
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
